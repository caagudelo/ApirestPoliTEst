services:
  api:
    build: .
    container_name: apirestpolitest_api
    env_file: .env
    ports:
      - "3211:${PORT:-3211}"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - /app/node_modules
    networks:
      - apirest_net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: apirestpolitest_mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_script.sql:/docker-entrypoint-initdb.d/database_script.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-rootpass} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - apirest_net
    restart: unless-stopped

networks:
  apirest_net:
    driver: bridge

volumes:
  mysql_data:
